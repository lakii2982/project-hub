<div class="form-field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required" aria-hidden="true"> *</span><span class="sr-only">（必填）</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div class="help-text" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
  {% if field.errors %}<div class="field-errors" role="alert">{{ field.errors }}</div>{% endif %}
</div>
