<div class="form-field{% if field.errors %} has-error{% endif %}">
  {{ field.label_tag }}
  {{ field }}
  {% if field.help_text %}<div class="help-text">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<div class="field-errors" role="alert">{{ error }}</div>{% endfor %}
</div>
