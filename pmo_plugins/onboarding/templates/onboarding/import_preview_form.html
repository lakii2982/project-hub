<form method="post" enctype="multipart/form-data" action="/modules/onboarding/import-preview-upload/">{% csrf_token %}
{% include 'partials/form_fields.html' with form=form %}

<div class="actions"><button type="submit" class="button primary">预览 CSV</button></div>
</form>
