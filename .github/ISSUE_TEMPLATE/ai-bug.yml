name: AI 整理缺陷
description: 提供可脱敏公开的复现与影响摘要，由受控桥接层生成结构化记录
title: "[AI Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 仅填写白名单业务字段和演练/匿名数据。安全漏洞请走私下报告渠道；Issue 不构成开工、审批或发布授权。
  - type: textarea
    id: summary
    attributes:
      label: 缺陷摘要
    validations:
      required: true
  - type: input
    id: observed_version
    attributes:
      label: 发生版本
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 每行一步，仅使用演练或匿名数据。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      options: [S0, S1, S2, S3]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 回归验收条件
      description: 每行一条可验证的验收条件。
    validations:
      required: true
  - type: textarea
    id: business_decisions
    attributes:
      label: 已确认的业务决策（若有）
  - type: input
    id: conversation_ref
    attributes:
      label: 非私密对话引用
    validations:
      required: true
  - type: input
    id: task_id
    attributes:
      label: 关联 PH 任务（若有）
  - type: input
    id: pr
    attributes:
      label: 关联 PR URL（若有）
  - type: input
    id: release
    attributes:
      label: 关联 Release URL（若有）
