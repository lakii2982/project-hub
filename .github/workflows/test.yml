name: Project Hub checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  governance:
    name: Project governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify PR against trusted BASE policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GIT_NO_REPLACE_OBJECTS: '1'
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git --no-replace-objects show "$BASE_SHA:scripts/check_pr.py" > "$RUNNER_TEMP/check_pr.py"
            python "$RUNNER_TEMP/check_pr.py"
          fi
      - run: python scripts/projectctl.py check
      - run: python -m unittest tests.test_projectctl tests.test_governance tests.test_quality_gate tests.test_delivery_policy -v
      - run: python scripts/release_check.py
  sqlite:
    name: SQLite domain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - name: Coverage, tests and quality gate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          BASE="$PR_BASE_SHA"
          if [ -z "$BASE" ]; then BASE="$PUSH_BASE_SHA"; fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          set +e
          python -m coverage run manage.py test tests --verbosity 2 > test-output.txt 2>&1
          TEST_EXIT=$?
          python -m coverage json -o coverage.json
          COV_EXIT=$?
          GATE_EXIT=0
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'BASE commit unavailable' >&2
            GATE_EXIT=1
          elif git --no-replace-objects cat-file -e "$BASE:project/delivery-policy.json" 2>/dev/null; then
            git --no-replace-objects show "$BASE:project/delivery-policy.json" > "$RUNNER_TEMP/base-policy.json"
            python - "$RUNNER_TEMP/base-policy.json" <<'PY'
          import json
          import sys
          try:
              data = json.load(open(sys.argv[1]))
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if isinstance(data, dict) and 'quality' in data else 2)
          PY
            POLICY_STATE=$?
            if [ "$POLICY_STATE" -eq 1 ]; then
              echo 'invalid BASE delivery policy' >&2
              GATE_EXIT=1
            elif [ "$POLICY_STATE" -eq 2 ]; then
              printf '%s\n' '{"ok":true,"status":"bootstrap_quality_policy_absent"}'
            elif git --no-replace-objects cat-file -e "$BASE:scripts/quality_gate.py" 2>/dev/null; then
              git --no-replace-objects show "$BASE:scripts/quality_gate.py" > "$RUNNER_TEMP/quality_gate.py"
              python "$RUNNER_TEMP/quality_gate.py" --root . --base "$BASE" --coverage coverage.json --test-log test-output.txt --changed-since "$BASE"
              GATE_EXIT=$?
            else
              echo 'BASE policy has quality but scripts/quality_gate.py is missing' >&2
              GATE_EXIT=1
            fi
          else
            printf '%s\n' '{"ok":true,"status":"bootstrap_quality_policy_absent"}'
          fi
          grep -E "skipped '|^Ran |^OK|^FAILED|^(FAIL|ERROR):" test-output.txt | tail -n 400 || true
          if [ "$TEST_EXIT" -ne 0 ] || [ "$COV_EXIT" -ne 0 ] || [ "$GATE_EXIT" -ne 0 ]; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sqlite-quality-evidence
          path: |
            test-output.txt
            coverage.json
          if-no-files-found: ignore
      - run: python manage.py migrate --noinput
      - run: python manage.py seed_demo
      - run: python manage.py verify_integrity --json
      - run: python manage.py collectstatic --noinput
      - run: pip inspect --local > application-dependencies.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-dependencies
          path: application-dependencies.json
  postgres:
    name: PostgreSQL domain
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pmo
          POSTGRES_USER: pmo
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pmo" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: pmo
      POSTGRES_USER: pmo
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-ci.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - name: Coverage, tests and quality gate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          BASE="$PR_BASE_SHA"
          if [ -z "$BASE" ]; then BASE="$PUSH_BASE_SHA"; fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          set +e
          python -m coverage run manage.py test tests --verbosity 2 > test-output.txt 2>&1
          TEST_EXIT=$?
          python -m coverage json -o coverage.json
          COV_EXIT=$?
          GATE_EXIT=0
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'BASE commit unavailable' >&2
            GATE_EXIT=1
          elif git --no-replace-objects cat-file -e "$BASE:project/delivery-policy.json" 2>/dev/null; then
            git --no-replace-objects show "$BASE:project/delivery-policy.json" > "$RUNNER_TEMP/base-policy.json"
            python - "$RUNNER_TEMP/base-policy.json" <<'PY'
          import json
          import sys
          try:
              data = json.load(open(sys.argv[1]))
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if isinstance(data, dict) and 'quality' in data else 2)
          PY
            POLICY_STATE=$?
            if [ "$POLICY_STATE" -eq 1 ]; then
              echo 'invalid BASE delivery policy' >&2
              GATE_EXIT=1
            elif [ "$POLICY_STATE" -eq 2 ]; then
              printf '%s\n' '{"ok":true,"status":"bootstrap_quality_policy_absent"}'
            elif git --no-replace-objects cat-file -e "$BASE:scripts/quality_gate.py" 2>/dev/null; then
              git --no-replace-objects show "$BASE:scripts/quality_gate.py" > "$RUNNER_TEMP/quality_gate.py"
              python "$RUNNER_TEMP/quality_gate.py" --root . --base "$BASE" --coverage coverage.json --test-log test-output.txt --changed-since "$BASE"
              GATE_EXIT=$?
            else
              echo 'BASE policy has quality but scripts/quality_gate.py is missing' >&2
              GATE_EXIT=1
            fi
          else
            printf '%s\n' '{"ok":true,"status":"bootstrap_quality_policy_absent"}'
          fi
          grep -E "skipped '|^Ran |^OK|^FAILED|^(FAIL|ERROR):" test-output.txt | tail -n 400 || true
          if [ "$TEST_EXIT" -ne 0 ] || [ "$COV_EXIT" -ne 0 ] || [ "$GATE_EXIT" -ne 0 ]; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: postgres-quality-evidence
          path: |
            test-output.txt
            coverage.json
          if-no-files-found: ignore
      - run: python manage.py migrate --noinput
      - run: python manage.py seed_demo
      - run: python manage.py verify_integrity --json
  mcp:
    name: MCP protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m venv .agent-venv
      - run: .agent-venv/bin/pip install -r integrations/mcp/requirements.txt
      - run: .agent-venv/bin/python -m unittest discover -s integrations/mcp -p 'test*.py'
      - run: .agent-venv/bin/python integrations/mcp/smoke_stdio.py
      - run: .agent-venv/bin/pip inspect --local > mcp-dependencies.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-dependencies
          path: mcp-dependencies.json
  hygiene:
    name: Public hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python scripts/public_hygiene.py
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - run: python scripts/package.py
      - name: Verify versioned source bundle
        run: |
          VERSION="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          python scripts/verify-source-package.py "releases/project-hub-$VERSION-source.zip"
      - name: Verify committed candidate metadata matches rebuilt package
        run: python scripts/check_candidate_metadata.py
  container:
    name: Container smoke
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: project-hub-ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Generate isolated CI configuration
        run: |
          python - <<'PY'
          import os, secrets
          from pathlib import Path
          Path('.env').write_text('PMO_DOMAIN=ci.invalid\nDJANGO_SECRET_KEY='+secrets.token_urlsafe(48)+'\nPOSTGRES_PASSWORD='+secrets.token_urlsafe(32)+'\n')
          os.chmod('.env',0o600)
          PY
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180 db app worker
      - run: docker compose exec -T app python manage.py check --deploy
      - run: docker compose exec -T -e PMO_ENV=development app python manage.py seed_demo
      - run: docker compose exec -T app python manage.py verify_integrity --json
      - name: Health and restart persistence
        run: |
          docker compose exec -T app python -c "import urllib.request; r=urllib.request.Request('http://localhost:8000/health/',headers={'X-Forwarded-Proto':'https'}); assert urllib.request.urlopen(r,timeout=5).status==200"
          docker compose restart app worker
          docker compose up -d --wait --wait-timeout 180 db app worker
          docker compose exec -T app python manage.py verify_integrity --json
      - name: Real dump and isolated database restore
        run: |
          sh scripts/backup.sh "$RUNNER_TEMP/project-hub-backup"
          (cd "$RUNNER_TEMP/project-hub-backup" && sha256sum -c SHA256SUMS)
          docker compose exec -T db createdb -U pmo pmo_restore_ci
          docker compose exec -T db pg_restore -U pmo --no-owner --exit-on-error -d pmo_restore_ci < "$RUNNER_TEMP/project-hub-backup/database.dump"
          docker compose exec -T -e POSTGRES_DB=pmo_restore_ci app python manage.py verify_integrity --json
      - if: failure()
        run: docker compose logs --no-color --tail=100
      - if: always()
        run: docker compose down -v
