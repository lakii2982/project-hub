name: Publish engineering release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag (vX.Y.Z) pointing at the current commit; the workflow never creates or pushes tags'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/test.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    # Protected environment: require reviewer approval and restrict secrets in repository settings.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify the tag already exists and points at this commit
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test -n "$TAG"
          git fetch --tags --force origin
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"
      - name: Validate release metadata
        env:
          TAG: ${{ inputs.tag }}
        run: python scripts/release_check.py --tag "$TAG"
      - run: python scripts/package.py
      - name: Verify source bundle
        run: |
          VERSION="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          python scripts/verify-source-package.py "releases/project-hub-$VERSION-source.zip"
      - name: Publish verified assets through a retryable draft
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/publish-release.py --tag "$TAG" --sha40hex "$GITHUB_SHA" --assets-dir releases --notes CHANGELOG.md
