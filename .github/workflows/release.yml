name: Publish engineering release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/test.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/release_check.py --tag "$GITHUB_REF_NAME"
      - run: python scripts/package.py
      - name: Verify source bundle
        run: |
          VERSION="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          python scripts/verify-source-package.py "releases/project-hub-$VERSION-source.zip"
      - name: Publish verified assets through a retryable draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/publish-release.py --tag "$GITHUB_REF_NAME" --sha40hex "$GITHUB_SHA" --assets-dir releases --notes CHANGELOG.md
