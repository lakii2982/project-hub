<form method="post" action="{% url 'review' kind record.pk %}" class="review-form">{% csrf_token %}<div class="form-field"><label for="review-{{ kind }}-{{ record.pk }}">审批意见</label><textarea id="review-{{ kind }}-{{ record.pk }}" name="note" rows="2" maxlength="300" placeholder="填写核验结论；退回时请说明原因"></textarea></div><div class="actions"><button class="button primary" type="submit" name="decision" value="approve">{% if kind == 'plan' %}批准计划{% else %}批准单据{% endif %}</button><button class="button" type="submit" name="decision" value="reject">退回修改</button></div></form>
