<div class="alert-list">{% for alert in alerts %}<article class="alert-item severity-{{ alert.severity }}"><span class="alert-indicator" aria-hidden="true"></span><div><h3>{% if alert.url %}<a href="{{ alert.url }}">{{ alert.title }} <span aria-hidden="true">↗</span></a>{% else %}{{ alert.title }}{% endif %}</h3><p>{{ alert.detail }}</p></div><span class="badge {% if alert.severity == 'high' or alert.severity == 'medium' %}warning{% else %}neutral{% endif %}">{% if alert.severity == 'high' %}优先处理{% elif alert.severity == 'medium' %}需关注{% else %}提示{% endif %}</span></article>{% empty %}<div class="empty-state compact"><h3>当前无规则提醒</h3><p>项目进度和财务记录将持续纳入检查。</p></div>{% endfor %}</div>
