{% comment %}PH-026 工作台页签：无 JavaScript 时为真实链接，服务端按 ?tab= 重渲染唯一可见面板；
static/app.js 的 [data-link-tabs] 增强只切换 hidden/aria-selected，不改服务端数据。
面板本身在 dashboard.html 的 .panel-stack 中，不放在本 partial。{% endcomment %}<div class="tabbar"><div class="tablist" role="tablist" aria-label="工作台页签" data-link-tabs><a class="tab" id="dash-tab-overview" role="tab" href="?tab=overview" aria-controls="dash-panel-overview" aria-selected="{% if active_tab == 'overview' %}true{% else %}false{% endif %}" tabindex="{% if active_tab == 'overview' %}0{% else %}-1{% endif %}">收益与现金</a><a class="tab" id="dash-tab-due" role="tab" href="?tab=due" aria-controls="dash-panel-due" aria-selected="{% if active_tab == 'due' %}true{% else %}false{% endif %}" tabindex="{% if active_tab == 'due' %}0{% else %}-1{% endif %}">到期提醒{% if due %} <span class="tab-count numeric">{{ due.count }}</span>{% endif %}</a><a class="tab" id="dash-tab-activity" role="tab" href="?tab=activity" aria-controls="dash-panel-activity" aria-selected="{% if active_tab == 'activity' %}true{% else %}false{% endif %}" tabindex="{% if active_tab == 'activity' %}0{% else %}-1{% endif %}">项目动态</a></div></div>
