function header(title,desc,action='新建项目',eyebrow='PROJECT OPERATIONS'){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div><div class="btns">${btn('导出报表',false,'download')}${btn(action,true,'plus')}</div></div>`}
function kpi(title,value,note,trend='↑ 12.8%',kind='blue',ico='briefcase'){return `<section class="card kpi"><div class="kpi-top"><span class="label">${title}</span><span class="metric-icon ${kind==='blue'?'':kind}">${icon(ico)}</span></div><div class="kpi-value">${value}</div><div class="kpi-foot"><span class="${(title.includes('成本')||title.includes('支出'))&&trend.startsWith('↓')?'up':trend.startsWith('↑')?'up':trend.startsWith('↓')?'down':''}">${trend}</span><span>${note}</span></div></section>`}

function chartSVG(type='cash',height=230){const w=630,h=height,pL=48,pR=14,pT=18,pB=30,plotH=h-pT-pB,plotW=w-pL-pR;let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="样例业务趋势图">`;for(let i=0;i<5;i++){let y=pT+i*plotH/4; s+=`<line x1="${pL}" y1="${y}" x2="${w-pR}" y2="${y}" stroke="#EDF1F7"/><text x="${pL-11}" y="${y+3}" font-size="10" fill="#9DAABB" text-anchor="end">${['200万','150万','100万','50万','0'][i]}</text>`} const labs=type==='cash'?['5月','6月','7月','8月','9月','10月','11月','12月']:['周一','周二','周三','周四','周五','周六','周日'];const N=labs.length;const vals=[42,54,57,69,74,84,90,100];const blue=[37,45,51,57,60,74,80,89],orange=[25,30,35,38,45,49,54,61];const x=i=>pL+(i+.5)*plotW/N;const y=v=>pT+plotH*(1-v/115);for(let i=0;i<N;i++){const X=x(i);s+=`<text x="${X}" y="${h-7}" text-anchor="middle" font-size="11" fill="#8A9AB0">${labs[i]}</text>`;const v=blue[i],e=orange[i];s+=`<rect x="${X-17}" y="${y(v)}" width="12" height="${pT+plotH-y(v)}" rx="3" fill="#77ABFF" opacity=".75"/><rect x="${X-2}" y="${y(e)}" width="12" height="${pT+plotH-y(e)}" rx="3" fill="#FFC16F"/>`}if(type!=='incomeCost'){const pts=Array.from({length:N},(_,i)=>`${x(i)},${y(vals[i])}`).join(' ');s+=`<polyline points="${pts}" fill="none" stroke="#0FADA9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;for(let i=0;i<N;i++){s+=`<circle cx="${x(i)}" cy="${y(vals[i])}" r="3.8" fill="#fff" stroke="#0FADA9" stroke-width="2"/>`}}return s+'</svg>'}
function timeChart(){let labels=['周一','周二','周三','周四','周五','周六','周日'],p=[7,8,8,7,9,3,2],a=[6,7,5,8,8,1,0];let s='<svg class="chart" viewBox="0 0 510 225" role="img" aria-label="本周工时数据示例">';for(let k=0;k<=4;k++){let y=25+k*40;s+=`<line x1="30" x2="500" y1="${y}" y2="${y}" stroke="#EDF1F7"/><text x="22" y="${y+4}" text-anchor="end" font-size="10" fill="#A0ADBD">${10-2*k}</text>`}labels.forEach((l,i)=>{let x=50+i*65;s+=`<rect x="${x}" y="${185-p[i]*15}" width="16" height="${p[i]*15}" fill="#D9E7FF" rx="3"/><rect x="${x+20}" y="${185-a[i]*15}" width="16" height="${a[i]*15}" fill="#3980F5" rx="3"/><text x="${x+17}" y="209" text-anchor="middle" font-size="10" fill="#8FA0B7">${l}</text>`});return s+'</svg>'}

function detail(){return `<div class="page-head"><div class="project-title"><div class="eyebrow">PROJECT / PJ-2026-001</div><h1>客户官网改版 &nbsp;${stat('进行中')}</h1><p>星河科技 · 项目经理 李明 · 项目周期 2026/10/02 — 2026/11/30</p></div><div class="btns">${btn('分享项目')}${btn('编辑项目',true)}</div></div><div class="grid kpi-grid">${kpi('总体完成进度','80%','关键节点正常','↑ 6%','blue','trend')}${kpi('项目合同金额','¥ 180,000','含税合同额','已签约','teal','wallet')}${kpi('已确认收入','¥ 128,000','当前收款进度','↑ 71%','orange','chart')}${kpi('项目已发生成本','¥ 76,500','合同成本占比','42.5%','purple','briefcase')}</div><div class="card"><div class="tabs"><button class="tab active" data-demo="项目概览">项目概览</button><button class="tab" data-go="tasks">项目任务</button><button class="tab" data-go="cost">成本核算</button><button class="tab" data-go="timesheet">项目工时</button><button class="tab" data-demo="项目文件">项目文件</button></div><div style="padding:0 22px 22px" class="grid columns-6-4">${card('里程碑与交付节点',`<div class="timeline">${[['需求分析','10-02','done'],['设计评审','10-12','done'],['开发实现','10-25','done'],['测试验收','11-10','current'],['正式上线','11-30','']].map(([n,t,state],i)=>`<div class="stage ${state}"><div class="circle">${state==='done'?'✓':i+1}</div><strong>${n}</strong><small>${t}</small></div>`).join('')}</div><div class="insight" style="margin-top:24px">${icon('spark',16)} 当前项目已完成 3 个里程碑，下一关键节点为 11 月 10 日的测试验收。</div>`, '', '项目总体进度 80%')}${card('项目成员',`<div class="activity">${avatar('李明',0)}<div class="activity-text">项目经理<div class="activity-time">负责交付管理与项目统筹</div></div></div><div class="activity">${avatar('王芳',1)}<div class="activity-text">视觉设计<div class="activity-time">负责界面与品牌资源</div></div></div><div class="activity">${avatar('张磊',2)}<div class="activity-text">开发工程师<div class="activity-time">负责前端及联调</div></div></div>`, '', '团队协作与责任分配')}</div></div></div><div class="grid columns-6-4" style="margin-top:16px">${card('近期项目任务',recentTasks(),`<button class="btn sm link" data-go="tasks">查看全部 →</button>`)}${card('近期项目动态',`<div class="activity">${avatar('王芳',1)}<di function drawNav(){document.querySelector('#brand-icon').innerHTML='<svg viewBox="0 0 24 24" width="24" height="24" fill="none"><path fill="white" d="M12 2.5 20.5 7v10L12 21.5 3.5 17V7L12 2.5Zm0 4.5-4.5 2.5V14L12 16.5 16.5 14V9.5L12 7Z"/></svg>';document.querySelector('#support-icon').innerHTML=icon('help');document.querySelector('#search-icon').innerHTML=icon('search');document.querySelector('#help-icon').innerHTML=icon('help');document.querySelector('#bell-icon').innerHTML=icon('bell');let html=navGroups.map(([g,items])=>`<div class="nav-group"><div class="nav-heading">${g}</div>${items.map(([route,name,ic])=>`<button class="nav-btn" data-go="${route}">${icon(ic)}<span>${name}</span>${route==='tasks'?'<span class="badge-count">6</span>':''}</button>`).join('')}</div>`).join('');document.querySelector('#main-nav').innerHTML=html;document.querySelectorAll('#main-nav [data-go]').forEach(n=>n.addEventListener('click',()=>navigate(n.dataset.go)))}
window.addEventListener('popstate',()=>render(location.hash.slice(1)||'dashboard'));
document.querySelector('#notice-btn').addEventListener('click',()=>toast('通知演示：您有 3 个待办提醒。'));document.querySelector('#help-btn').addEventListener('click',()=>toast('请接入现有系统的帮助中心。'));document.querySelector('#search-box').addEventListener('click',()=>toast('全局搜索需复用现有接口。'));
document.querySelector('#menu-btn').addEventListener('click',()=>{const overlay=document.createElement('div');overlay.id='mobile-overlay';overlay.className='mobile-nav-overlay';overlay.innerHTML=`<div class="mobile-menu">${document.querySelector('#main-nav').innerHTML}</div>`;document.body.appendChild(overlay);overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});overlay.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>navigate(el.dataset.go)))});
drawNav();render(location.hash.slice(1)||'dashboard');
</script>
